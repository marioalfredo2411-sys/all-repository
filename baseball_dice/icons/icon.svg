<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Baseball Dice">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#245231"/>
      <stop offset="1" stop-color="#0f2416"/>
    </linearGradient>
    <linearGradient id="die" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#faf7f0"/>
      <stop offset="1" stop-color="#d9ccb8"/>
    </linearGradient>
    <radialGradient id="ball" cx="38%" cy="34%" r="72%">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#dde0e4"/>
    </radialGradient>
  </defs>

  <rect width="512" height="512" fill="url(#bg)"/>

  <!-- DADO -->
  <g transform="rotate(-15 198 200)">
    <rect x="66" y="70" width="264" height="264" rx="46" fill="#000" opacity="0.28" transform="translate(9 12)"/>
    <rect x="66" y="70" width="264" height="264" rx="46" fill="url(#die)" stroke="#8b5e3c" stroke-width="7"/>
    <g fill="#c0392b">
      <circle cx="128" cy="132" r="21"/>
      <circle cx="268" cy="132" r="21"/>
      <circle cx="198" cy="202" r="21"/>
      <circle cx="128" cy="272" r="21"/>
      <circle cx="268" cy="272" r="21"/>
    </g>
  </g>

  <!-- PELOTA DE BASEBALL -->
  <g transform="translate(328 332)">
    <circle cx="11" cy="15" r="130" fill="#000" opacity="0.30"/>
    <circle r="130" fill="url(#ball)"/>
    <clipPath id="bc"><circle r="130"/></clipPath>
    <g clip-path="url(#bc)">
      <g fill="none" stroke="#c0392b" stroke-width="11" stroke-linecap="round">
        <path d="M -150 -122 A 150 150 0 0 1 -150 122"/>
        <path d="M 150 -122 A 150 150 0 0 0 150 122"/>
      </g>
      <g stroke="#c0392b" stroke-width="6" stroke-linecap="round">
        <path d="M -95 -96 l -18 -5 M -73 -61 l -18 -3 M -61 -21 l -18 -1 M -61 21 l -18 1 M -73 61 l -18 3 M -95 96 l -18 5"/>
        <path d="M 95 -96 l 18 -5 M 73 -61 l 18 -3 M 61 -21 l 18 -1 M 61 21 l 18 1 M 73 61 l 18 3 M 95 96 l 18 5"/>
      </g>
    </g>
  </g>
</svg>
