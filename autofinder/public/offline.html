<!doctype html>
<html lang="es-CO">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#080b12" />
    <title>Sin conexión · AutoFinder CO</title>
    <style>
      :root {
        --bg: #080b12;
        --card: #131b27;
        --border: #1e2d42;
        --accent: #e63946;
        --text: #e8edf5;
        --muted: #7a8fa8;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
        background: var(--bg);
        color: var(--text);
        font-family: "Barlow", system-ui, -apple-system, "Segoe UI", sans-serif;
      }
      .caja {
        max-width: 380px;
        text-align: center;
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 16px;
        padding: 32px 24px;
      }
      img {
        width: 84px;
        height: 84px;
        margin-bottom: 16px;
      }
      h1 {
        font-family: "Barlow Condensed", system-ui, sans-serif;
        font-size: 28px;
        letter-spacing: 0.5px;
        margin: 0 0 8px;
        text-transform: uppercase;
      }
      p {
        color: var(--muted);
        line-height: 1.5;
        margin: 0 0 24px;
        font-size: 15px;
      }
      button {
        font: inherit;
        font-weight: 600;
        color: #fff;
        background: var(--accent);
        border: 0;
        border-radius: 10px;
        padding: 12px 26px;
        cursor: pointer;
      }
      button:active {
        transform: translateY(1px);
      }
    </style>
  </head>
  <body>
    <div class="caja">
      <img src="/icons/icon-192.png" alt="AutoFinder CO" />
      <h1>Sin conexión</h1>
      <p>
        AutoFinder CO necesita internet para consultar precios del mercado colombiano. Tus
        favoritos guardados siguen disponibles al reconectar.
      </p>
      <button onclick="location.reload()">Reintentar</button>
    </div>
  </body>
</html>
