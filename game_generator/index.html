<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1" />
  <meta name="theme-color" content="#1A6B55" />
  <meta name="description" content="Juegos CCI AL - Generador interactivo de juegos grupales con IA. Recreación con Propósito." />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Juegos CCI AL" />
  <meta name="application-name" content="Juegos CCI AL" />
  <meta name="msapplication-TileColor" content="#1A6B55" />
  <meta name="msapplication-config" content="/browserconfig.xml" />
  
  <!-- Apple Touch Icons -->
  <link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 180 180'%3E%3Crect fill='%231A6B55' width='180' height='180'/%3E%3Ctext x='90' y='90' dominant-baseline='middle' text-anchor='middle' font-size='90' font-weight='bold' fill='%23F47920' font-family='Segoe UI, sans-serif'%3EJ%3C/text%3E%3C/svg%3E" />
  
  <!-- Favicon -->
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect fill='%231A6B55' width='100' height='100'/%3E%3Ctext x='50' y='50' dominant-baseline='middle' text-anchor='middle' font-size='60' font-weight='bold' fill='%23F47920' font-family='Segoe UI, sans-serif'%3EJ%3C/text%3E%3C/svg%3E" />
  
  <!-- PWA Manifest -->
  <link rel="manifest" href="/manifest.json" />
  
  <!-- Preconnect a APIs necesarias -->
  <link rel="preconnect" href="https://api.anthropic.com" />
  
  <title>Juegos CCI AL - Recreación con Propósito</title>
  
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    html, body {
      width: 100%;
      height: 100%;
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      background: #FFFFFF;
      color: #1a2e25;
    }
    
    body {
      padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
    }
    
    #root {
      width: 100%;
      height: 100%;
    }
    
    /* Soporte para notch en iOS */
    @supports (padding: max(0px)) {
      body {
        padding-left: max(12px, env(safe-area-inset-left));
        padding-right: max(12px, env(safe-area-inset-right));
        padding-top: max(12px, env(safe-area-inset-top));
        padding-bottom: max(12px, env(safe-area-inset-bottom));
      }
    }
  </style>
</head>
<body>
  <div id="root"></div>
  
  <script type="module" src="/main.jsx"></script>
</body>
</html>
